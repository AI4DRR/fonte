services:
  extractor:
    build: .
    image: undrr-groundsource:latest
    container_name: undrr-extractor
    env_file: .env
    volumes:
      # Persist outputs to the VM's working directory so results survive
      # container rebuilds.
      - ./outputs:/app/outputs
      # The Nominatim geocode cache is large and slow to rebuild; keep it
      # on the host so reruns stay fast.
      - ./.nominatim_cache.json:/app/.nominatim_cache.json
    # Default command is the extraction pipeline. Run polygon resolution
    # with: `docker compose run --rm extractor groundsource-polygons ...`
    command:
      - groundsource-extract
      - --limit
      - "10000"
      - --resume
      - --checkpoint-every
      - "5000"
      - --output-dir
      - outputs/event_extractions
    # On stop, the extractor cancels queued work, waits for in-flight API
    # calls, and writes a final checkpoint — give it time before SIGKILL.
    stop_grace_period: 10m

  review:
    # Streamlit gold-review UI. Start with `docker compose up review`.
    image: undrr-groundsource:latest
    container_name: undrr-review
    depends_on:
      - extractor
    env_file: .env
    volumes:
      - ./outputs:/app/outputs
    ports:
      - "8501:8501"
    command:
      - streamlit
      - run
      - eval/gold_review_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
